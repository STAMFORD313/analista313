name: relleno_opendota
# Relleno del historial de OpenDota (partidas pro de Dota 2) para entrenar el Elo. Se puede volver a lanzar a mano.
on:
  workflow_dispatch:
  push: {branches: [main], paths: [".github/workflows/relleno_opendota.yml"]}
concurrency: datos_espn   # el mismo grupo que nutricion: nunca escriben a la vez los mismos archivos
permissions: {contents: write}
jobs:
  relleno:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python fuentes.py opendota 1500
        env: {PYTHONUNBUFFERED: "1"}
      - run: |
          git config user.name analista-bot && git config user.email bot@users.noreply.github.com
          git add data/dota2/opendota.csv
          git diff --cached --quiet && exit 0
          git commit -m "datos OpenDota: historial de partidas pro (relleno)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs -q && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 10; done; exit 1
