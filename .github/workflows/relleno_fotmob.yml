name: relleno_fotmob
# Relleno del historial de FotMob (estadísticas con xG por partido) para entrenar. Se puede volver a lanzar a mano.
on:
  workflow_dispatch:
  push: {branches: [main], paths: [".github/workflows/relleno_fotmob.yml"]}
concurrency: datos_espn   # el mismo grupo que nutricion: nunca escriben a la vez los mismos archivos
permissions: {contents: write}
jobs:
  relleno:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python fuentes.py fotmob 5000
        env: {PYTHONUNBUFFERED: "1"}
      - run: |
          git config user.name analista-bot && git config user.email bot@users.noreply.github.com
          git add data/fotmob
          git diff --cached --quiet && exit 0
          git commit -m "datos FotMob: historial con xG (relleno)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs -q && git push && exit 0; git rebase --abort 2>/dev/null; sleep 10; done; exit 1
