name: probar_interprete
# Prueba a mano del intérprete del chat (Gemini con el secreto GEMINI_API_KEY).
on:
  workflow_dispatch:
  push: {branches: [main], paths: ["smarkets.py", "valor_pinnacle.py", "kambi.py", "fuentes.py", "interpreta.py", "chat.py",  ".github/workflows/probar_interprete.yml"]}
permissions: {contents: read}
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import requests, json, collections
          ev = []
          for off in (0, 100, 200, 300):
              r = requests.get("https://gamma-api.polymarket.com/events", params={"tag_slug": "soccer", "closed": "false", "limit": 100, "offset": off}, timeout=20)
              ev += r.json()
          print(len(ev), "eventos")
          c = collections.Counter(m.get("sportsMarketType") for e in ev for m in e.get("markets", []))
          print(c)
          n = 0
          for e in ev:
              ms = [m for m in e.get("markets", []) if m.get("sportsMarketType") == "moneyline"]
              if not ms or n >= 6: continue
              n += 1
              print(e.get("title"), e.get("startDate"), [t.get("slug") for t in e.get("tags", [])][:6])
              for m in ms:
                  print("   ", m.get("question"), m.get("outcomePrices"), "bid", m.get("bestBid"), "ask", m.get("bestAsk"), "liq", m.get("liquidityNum"), "vol", m.get("volumeNum"), "fee", m.get("feesEnabled"), m.get("takerBaseFee"), m.get("gameStartTime"))
          print(sorted(ev[0].get("markets", [{}])[0].keys()))
          PY
        env:
          PYTHONUNBUFFERED: "1"
