name: probar_interprete
# Prueba a mano del intérprete del chat (Gemini con el secreto GEMINI_API_KEY).
on:
  workflow_dispatch:
  push: {branches: [main], paths: ["interpreta.py", ".github/workflows/probar_interprete.yml"]}
permissions: {contents: read}
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests google-genai
      - run: python interpreta.py
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
