name: probar_interprete
# Prueba a mano del intérprete del chat (Gemini con el secreto GEMINI_API_KEY).
on:
  workflow_dispatch:
  push: {branches: [main], paths: ["smarkets.py", "valor_pinnacle.py", "kambi.py", "fuentes.py", "interpreta.py", "chat.py",  ".github/workflows/probar_interprete.yml"]}
permissions: {contents: read}
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import requests, json
          r = requests.get("https://gamma-api.polymarket.com/events", params={"tag_slug": "soccer", "closed": "false", "limit": 5, "order": "startDate", "ascending": "false"}, timeout=20)
          print(r.status_code)
          for e in r.json()[:5]:
              print(e.get("title"), e.get("startDate"), e.get("endDate"))
              for m in e.get("markets", [])[:4]:
                  print("   ", m.get("question"), m.get("outcomes"), m.get("outcomePrices"), m.get("liquidity"), m.get("sportsMarketType"), m.get("gameStartTime"))
          r = requests.get("https://gamma-api.polymarket.com/sports", timeout=20); print(r.status_code, json.dumps(r.json())[:1500])
          PY
        env:
          PYTHONUNBUFFERED: "1"
