name: probar_interprete
# Prueba a mano del intérprete del chat (Gemini con el secreto GEMINI_API_KEY).
on:
  workflow_dispatch:
  push: {branches: [main], paths: ["smarkets.py", "valor_pinnacle.py", "kambi.py", "fc_combo.py", "fuentes.py", "interpreta.py", "chat.py", "simulaciones.py", "fuentes.py",  ".github/workflows/probar_interprete.yml"]}
permissions: {contents: read}
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import requests, kambi as K, analyst as A
          import pandas as pd
          now = pd.Timestamp.now(tz="UTC") + pd.Timedelta(minutes=8)
          print("ahora", pd.Timestamp.now(tz="UTC"))
          ev = sorted((e for e in K.esoccer_events("leoes") if pd.Timestamp(e["start"]) > now), key=lambda e: e["start"])[:16]
          for e in ev:
              r = requests.get(f"https://eu-offering-api.kambicdn.com/offering/v2018/leoes/betoffer/event/{e['id']}.json", params=K.Q, headers=A.UA, timeout=30).json()
              h = (r.get("events") or [{}])[0]
              print(f"## {e['start']} | {h.get('homeName')} vs {h.get('awayName')} | {e['liga'][-25:]}")
              for b in r.get("betOffers", []):
                  lab = b["criterion"].get("englishLabel")
                  if "Half" in lab or "Odd" in lab: continue
                  print("  ", lab, "|", " · ".join(f"{(o.get('englishLabel') or o.get('participant') or '')}{'' if o.get('line') is None else ' ' + str(o['line']/1000)} {o['odds']/1000:.2f}" for o in b.get("outcomes", []) if o.get("odds")))
          PY
      - run: |
          python -c "
          import simulaciones as S, pandas as pd
          now = pd.Timestamp.now(tz='UTC')
          print('nba', S._scoreboard('basketball/nba', now, sport='nba')[:3]); print('nhl', S._scoreboard('hockey/nhl', now, sport='nhl')[:2])
          for slug, code in (('uefa.champions', 'ucl'), ('uefa.europa', 'uel'), ('eng.2', 'E1')):
              b = S._scoreboard(slug, now); x = next((x for x in b if x[1] in ('in', 'post')), None); print(slug, len(b), x)
              if x:
                  g = S.live_game({'code': code, 'home': x[3], 'away': x[4], 'start': str(now)}, {})
                  print(g['estado'], g['reloj'], g['hs'], g['as'], g['team_stats']); print(S.live_leg({'txt': 'Más de 8.5 córners'}, g), S.live_leg({'txt': 'Gana ' + x[3]}, g))
          "
          python -c "import valor_pinnacle as V, collections; c = V.candidates(); print(len(c), 'con valor', collections.Counter(x['book'] for x in c))"
          python -c "import chat; print('partidos 48 h', {k: len(v) for k, v in chat.upcoming(chat.DAY_LEAGUES).items()})"
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
