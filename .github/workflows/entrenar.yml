name: entrenar
on:
  schedule: [{cron: "41 3 * * 1"}]   # lunes 03:41 UTC: reentreno semanal de los esports (regiones la 1.ª semana del mes)
  workflow_dispatch:
permissions: {contents: write}
concurrency: entrenar
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      # cada juego por separado: si uno falla, los demás se entrenan igual; solo cambia params.json si no empeora
      - run: for g in cs2 dota2 lol r6 mlbb; do python train_cs2.py $g auto || echo "fallo en $g"; done
      - run: |
          git config user.name analista-bot
          git config user.email actions@users.noreply.github.com
          git add data/{cs2,dota2,lol,r6,mlbb}/params.json data/{cs2,dota2,lol,r6,mlbb}/teams.csv
          git diff --cached --quiet && exit 0
          git commit -m "reentreno semanal de esports $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs -q && git push && exit 0; git rebase --abort 2>/dev/null; sleep 10; done; exit 1
