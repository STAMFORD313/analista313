name: nutricion
# Descarga de ESPN que no cabe en el run de cada 30 min: jugadores, porteros y árbitro de fútbol (espn_soccer.py,
# incremental, 1.500 partidos por ejecución hasta completar 3 temporadas) y boxscores NBA/NHL con rebotes, asistencias,
# triples y tiros por jugador (nba_players.py descargar <liga> completo: rehace los guardados con el formato antiguo).
on:
  workflow_dispatch:
  schedule: [{cron: "23 */3 * * *"}]   # bot «nutrición»: cada 3 h (el reloj de analista no lo lanza; si GitHub se salta crons, lo rearranca el push)
  push: {branches: [main], paths: [".github/workflows/datos_espn.yml"]}
permissions: {contents: write}
concurrency: datos_espn
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      # equipo de bots expertos (scripts, sin IA): el coordinador ejecuta los que tocan y deja el parte en data/expertos.json
      - run: python nutricion.py
      - run: |
          git config user.name analista-bot
          git config user.email actions@users.noreply.github.com
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "datos ESPN $(date -u +%FT%H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs -q && git push && exit 0; git rebase --abort 2>/dev/null; sleep 10; done; exit 1
