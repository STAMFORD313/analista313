name: menu
on:
  schedule: [{cron: "0 */5 * * *"}]   # cada 5 h arranca una escucha nueva de ~5 h 45 min: cubre las 24 h
  workflow_dispatch:
  push: {branches: [main], paths: ["menu.py", "radar.py", "bankroll.py", "esports.py", "chat.py", "voz.py", ".github/workflows/menu.yml"]}
concurrency: {group: menu, cancel-in-progress: true}   # la nueva releva a la anterior (un solo lector de Telegram)
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pip install faster-whisper   # notas de voz (voz.py): Whisper en la CPU, sin IA de pago; si falla, el chat de texto sigue
        continue-on-error: true
      - run: python menu.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
