name: menu
on:
  schedule: [{cron: "0 */5 * * *"}]   # cada 5 h arranca una escucha nueva de ~5 h 45 min: cubre las 24 h
  workflow_dispatch:
  push: {branches: [main], paths: ["menu.py", "radar.py", "bankroll.py", "esports.py", "chat.py", "voz.py", "interpreta.py", "simulaciones.py", ".github/workflows/menu.yml"]}
concurrency: {group: menu, cancel-in-progress: true}   # la nueva releva a la anterior (un solo lector de Telegram)
permissions: {contents: write}   # sube data/chat_simuladas.json (apuestas simuladas desde el chat)
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pip install faster-whisper anthropic   # notas de voz (voz.py) e intérprete (interpreta.py); si falla, el chat con reglas sigue
        continue-on-error: true
      - run: python menu.py
        env:
          PYTHONUNBUFFERED: "1"   # que los errores salgan en el log al momento
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # intérprete del chat (interpreta.py) con Gemini, plan gratis
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # opcional (de pago): si existe, se usa Claude en vez de Gemini
